<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Be Always Light</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="BALI (Be Always Light) is a Miami 501(c)(3) charity building a community bank of food, clothing, education and school supplies. Partner with us.">
<meta property="og:title" content="BALI — Be Always Light">
<meta property="og:description" content="Help us build a community bank of food, clothing and education in Miami.">
<style>*,*::before,*::after{box-sizing:border-box}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Lato:wght@400;700&display=swap">
<style>
/* Layout: one warm, single-theme page in BALI's brand kit (cream, teal, gold, flame). Sticky header with Donate; bands alternate cream / white / teal. */
:root {
  --cream: #FBF7EE;
  --white: #FFFFFF;
  --teal: #14655B;
  --teal-deep: #0E4A43;
  --gold: #C8901A;
  --flame: #E8892B;
  --ink: #222222;
  --muted: #5C5A55;
  --line: #E9DFC9;
  --gold-soft: #F4E7C8;
  --serif: "Playfair Display", "Iowan Old Style", Georgia, serif;
  --sans: "Lato", "Helvetica Neue", Arial, sans-serif;
  --radius: 14px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; animation: none !important; } }
body { background: var(--cream); color: var(--ink); font-family: var(--sans); font-size: 18px; line-height: 1.6; }
a { color: var(--teal); }
:focus-visible { outline: 3px solid var(--flame); outline-offset: 2px; }
p { max-width: 65ch; }

.wrap { max-width: 1100px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
section.band { padding-block: 76px; scroll-margin-top: 70px; }
section.white { background: var(--white); }
section.teal { background: var(--teal); color: #FFFFFF; }
section.teal a { color: #FFE2A8; }

h1, h2, h3 { font-family: var(--serif); font-weight: 600; line-height: 1.12; text-wrap: balance; margin: 0; color: var(--teal); }
section.teal h2, section.teal h3 { color: #FFFFFF; }
h1 { font-size: clamp(38px, 6vw, 64px); letter-spacing: -0.01em; }
h2 { font-size: clamp(30px, 4.4vw, 44px); }
h3 { font-size: 24px; }
.eyebrow { font-family: var(--sans); font-size: 13px; font-weight: 700; letter-spacing: 0.24em; text-transform: uppercase; color: var(--gold); margin: 0 0 14px; }
section.teal .eyebrow { color: #F2C66B; }
.eyebrow.keep-case { text-transform: none; }
.lede { font-size: 21px; color: var(--muted); margin: 18px 0 0; }
section.teal .lede { color: #DCEDEA; }

/* Header */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: rgba(251, 247, 238, 0.94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; align-items: center; gap: 18px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--teal); flex: none; }
.brand img { width: 30px; height: auto; }
.brand b { font-family: var(--serif); font-size: 24px; font-weight: 600; letter-spacing: 0.04em; line-height: 1; }
.brand small { display: block; font-size: 9px; letter-spacing: 0.3em; color: var(--gold); font-weight: 700; margin-top: 3px; }
nav.links { display: flex; gap: 18px; margin-left: auto; font-size: 15px; white-space: nowrap; }
nav.links a { color: var(--ink); text-decoration: none; }
nav.links a:hover { color: var(--teal); }
.lang { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; font-size: 13px; flex: none; background: var(--white); }
.lang button { border: 0; background: transparent; color: var(--muted); padding: 6px 11px; cursor: pointer; font: inherit; font-weight: 700; }
.lang button[aria-pressed="true"] { background: var(--teal); color: #FFFFFF; }
@media (max-width: 1120px) { nav.links { display: none; } .lang { margin-left: auto; } }
header.top .btn { white-space: nowrap; }
@media (max-width: 560px) {
  header.top .wrap { gap: 10px; }
  .brand > span { display: none; }
  .brand img { width: 34px; }
  header.top .btn.small { padding: 8px 12px; font-size: 13px; }
}

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-family: var(--sans); font-size: 16px; font-weight: 700; padding: 13px 22px; border-radius: 999px; border: 2px solid var(--teal); background: var(--teal); color: #FFFFFF; text-decoration: none; cursor: pointer; }
.btn:hover { background: var(--teal-deep); border-color: var(--teal-deep); }
.btn.gold { background: var(--gold); border-color: var(--gold); color: #FFFFFF; }
.btn.gold:hover { background: #A9770F; border-color: #A9770F; }
.btn.ghost { background: transparent; color: var(--teal); }
.btn.ghost:hover { background: var(--teal); color: #FFFFFF; }
.btn.small { padding: 9px 16px; font-size: 14px; }
section.teal .btn.ghost { color: #FFFFFF; border-color: #FFFFFF; }
section.teal .btn.ghost:hover { background: #FFFFFF; color: var(--teal); }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }

/* Hero */
.hero { padding-block: 56px 76px; background: radial-gradient(ellipse 60% 70% at 78% 40%, #FFF3D6 0%, var(--cream) 70%); }
.hero .wrap { display: grid; grid-template-columns: 1.3fr 1fr; gap: 40px; align-items: center; }
.hero .copy { min-width: 0; }
.hero .row { margin-top: 30px; }
.hero .badge { justify-self: center; width: min(380px, 100%); max-width: 100%; filter: drop-shadow(0 18px 40px rgba(232, 137, 43, 0.25)); }
.hero .note { margin-top: 18px; font-size: 15px; color: var(--muted); }
@media (max-width: 820px) { .hero .wrap { grid-template-columns: 1fr; } .hero .badge { width: 240px; grid-row: 1; } }

/* Who we are + video */
.who { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 48px; align-items: center; }
.who > * { min-width: 0; }
.who p { font-size: 20px; }
.video { justify-self: center; width: min(320px, 100%); }
.video video { display: block; width: 100%; max-width: 100%; aspect-ratio: 9 / 16; border-radius: 18px; background: var(--teal); box-shadow: 0 0 0 6px var(--gold-soft), 0 20px 50px rgba(20, 101, 91, 0.25); }
.video figcaption { font-size: 14px; color: var(--muted); text-align: center; margin-top: 12px; }
@media (max-width: 820px) { .who { grid-template-columns: 1fr; } }

/* Program cards */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; margin-top: 36px; }
.card { background: var(--white); border: 1px solid var(--line); border-radius: var(--radius); padding: 26px; display: grid; gap: 12px; align-content: start; }
section.white .card { background: var(--cream); }
.card .ico { width: 46px; height: 46px; border-radius: 50%; background: var(--gold-soft); display: grid; place-items: center; }
.card .ico svg { width: 24px; height: 24px; }
.card h3 { font-size: 23px; }
.card p { margin: 0; color: var(--muted); font-size: 17px; }
.card .tag { justify-self: start; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--teal); background: #E3F0EE; padding: 4px 10px; border-radius: 999px; }

/* Spotlight */
.spot { display: grid; grid-template-columns: 1.3fr 1fr; gap: 44px; align-items: center; }
.spot > * { min-width: 0; }
.spot ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.spot li { display: flex; gap: 12px; align-items: flex-start; font-size: 17px; }
.spot li::before { content: ""; flex: none; width: 10px; height: 10px; margin-top: 9px; border-radius: 50%; background: #F2C66B; }
.textbox { margin-top: 26px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3); border-radius: var(--radius); padding: 18px 20px; }
.textbox b { font-family: var(--serif); font-size: 30px; font-weight: 600; letter-spacing: 0.02em; display: block; user-select: all; }
@media (max-width: 820px) { .spot { grid-template-columns: 1fr; } }

/* Involved */
.involve { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; margin-top: 36px; }
@media (max-width: 960px) { .involve { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 560px) { .involve { grid-template-columns: 1fr; } }
.involve .card .btn { justify-self: start; margin-top: 6px; }
.give-note { max-width: none; margin-top: 22px; background: var(--gold-soft); border-radius: var(--radius); padding: 16px 20px; font-size: 16px; color: var(--ink); }
.give-note b { color: var(--teal); }
.cta-band { margin-top: 44px; text-align: center; padding: 40px 20px; border-radius: 20px; background: var(--teal); color: #FFFFFF; }
.cta-band h3 { color: #FFFFFF; font-size: clamp(26px, 4vw, 36px); }
.cta-band p { margin: 10px auto 22px; color: #DCEDEA; }
.cta-band .row { justify-content: center; }
.cta-band .btn.ghost { color: #FFFFFF; border-color: #FFFFFF; }

/* Needs */
.needs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 34px; }
@media (max-width: 900px) { .needs { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 560px) { .needs { grid-template-columns: 1fr; } }
.need { background: var(--white); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; display: grid; gap: 10px; align-content: start; }
.need.gift { background: var(--gold-soft); border-color: #E7CF96; }
.need.gift { grid-column: 1 / -1; }
.need .ico { width: 46px; height: 46px; border-radius: 50%; background: #E3F0EE; display: grid; place-items: center; }
.need.gift .ico { background: #FFFFFF; }
.need .ico svg { width: 24px; height: 24px; }
.need h3 { font-size: 21px; }
.need p { margin: 0; color: var(--muted); font-size: 16px; }
button.link { justify-self: start; background: none; border: 0; padding: 0; font: 700 15px var(--sans); color: var(--teal); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
/* Talents */
.talent-head { text-align: center; display: grid; justify-items: center; }
.talent-head .lede { max-width: 60ch; }
.pros { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 34px; }
.pros div { background: var(--white); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; display: grid; gap: 4px; align-content: start; min-width: 0; }
.pros b { font-family: var(--serif); font-size: 19px; font-weight: 600; color: var(--teal); }
.pros span { font-size: 15px; color: var(--muted); }
.pros .any { background: var(--gold-soft); border-color: #E7CF96; }
@media (max-width: 900px) { .pros { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 480px) { .pros { grid-template-columns: 1fr; } }
/* Bank */
.bank { display: grid; grid-template-columns: 1fr 1.1fr; gap: 44px; align-items: center; }
.bank > * { min-width: 0; }
.flow { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; counter-reset: f; }
.flow li { counter-increment: f; display: grid; grid-template-columns: 44px 1fr; gap: 4px 14px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.22); border-radius: var(--radius); padding: 16px 18px; }
.flow li::before { content: counter(f); grid-row: span 2; width: 36px; height: 36px; border-radius: 50%; background: #F2C66B; color: var(--teal-deep); font: 600 18px var(--serif); display: grid; place-items: center; }
.flow b { font-family: var(--serif); font-size: 20px; font-weight: 600; color: #FFFFFF; }
.flow span { font-size: 16px; color: #DCEDEA; }
@media (max-width: 820px) { .bank { grid-template-columns: 1fr; } }
.textbox.light { background: var(--white); border-color: var(--line); }
.textbox.light b { color: var(--teal); }
#help .spot li::before { background: var(--gold); }
.checks { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; border: 0; padding: 0; margin: 0; }
.checks.field legend { grid-column: 1 / -1; font-size: 14px; font-weight: 700; margin-bottom: 6px; }
.checks.field label { display: flex; gap: 10px; align-items: flex-start; justify-content: flex-start; text-align: left; font-size: 15px; font-weight: 400; cursor: pointer; }
.checks.field input { flex: none; width: 18px; height: 18px; margin: 2px 0 0; padding: 0; accent-color: var(--teal); }
@media (max-width: 520px) { .checks { grid-template-columns: 1fr; } }

/* Saying */
.saying { text-align: center; padding-block: 84px; background: radial-gradient(ellipse 60% 80% at 50% 0%, #1B7A6E, var(--teal) 70%); }
.saying .wrap { display: grid; justify-items: center; gap: 14px; }
.saying .flame { width: 34px; height: 34px; filter: drop-shadow(0 0 12px rgba(242, 198, 107, 0.7)); }
.saying blockquote { margin: 0; font-family: var(--serif); font-style: italic; font-weight: 400; font-size: clamp(30px, 5vw, 52px); line-height: 1.15; color: #FFFFFF; max-width: 22ch; text-wrap: balance; }
.saying .gloss { margin: 0; font-size: 18px; color: #DCEDEA; }
.saying .walk { margin: 10px 0 0; font-size: 13px; font-weight: 700; letter-spacing: 0.24em; text-transform: uppercase; color: #F2C66B; }

/* Story */
.story { display: grid; grid-template-columns: 1.3fr 1fr; gap: 48px; margin-top: 30px; }
.story > * { min-width: 0; }
.mission { margin: 26px 0 0; font-family: var(--serif); font-style: italic; font-size: 25px; line-height: 1.35; color: var(--teal); border-left: 3px solid var(--gold); padding-left: 20px; }
.family { margin: 0 0 18px; }
.family img { display: block; width: 100%; max-width: 100%; aspect-ratio: 788 / 419; object-fit: cover; border-radius: var(--radius); box-shadow: 0 0 0 5px var(--gold-soft), 0 16px 40px rgba(20, 101, 91, 0.18); }
.family figcaption { margin-top: 14px; font-size: 14px; color: var(--muted); text-align: center; display: grid; gap: 4px; }
.family .gift { font-family: var(--serif); font-style: italic; font-size: 21px; line-height: 1.3; color: var(--teal); }
.beginnings { margin: 48px 0 0; display: grid; gap: 16px; }
.beginnings figcaption { display: grid; gap: 4px; max-width: 60ch; font-size: 17px; color: var(--muted); }
.beginnings .eyebrow { margin: 0; }
.meals { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.meals img { display: block; width: 100%; max-width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 12px; }
@media (max-width: 700px) { .meals { grid-template-columns: repeat(2, 1fr); } }
.tenet.lead { margin-top: 34px; grid-template-columns: 40px 1fr; gap: 16px; align-items: start; background: var(--teal); border-color: var(--teal); padding: 28px; }
.tenet.lead svg { width: 34px; height: 34px; filter: drop-shadow(0 0 10px rgba(242, 198, 107, 0.6)); }
.tenet.lead svg path { fill: #F2C66B; }
.tenet.lead h3 { color: #FFFFFF; font-size: 28px; margin: 0 0 6px; }
.tenet.lead p { color: #DCEDEA; font-size: 18px; max-width: 70ch; }
.tenet.lead .lead-tag { margin: 0 0 6px; font-size: 12px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: #F2C66B; }
.tenets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: 18px; }
.tenet { background: var(--cream); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.tenet svg { width: 26px; height: 26px; }
.tenet h3 { font-size: 22px; }
.tenet p { margin: 0; font-size: 16px; color: var(--muted); }
@media (max-width: 900px) { .tenets { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 560px) { .tenets { grid-template-columns: 1fr; } }
.ocean { margin: 44px auto 0; max-width: 820px; text-align: center; display: grid; justify-items: center; gap: 12px; }
.ocean svg { width: 96px; height: 16px; }
.ocean blockquote { margin: 0; font-family: var(--serif); font-style: italic; font-size: 22px; line-height: 1.45; color: var(--teal); }
.ocean blockquote p { margin: 0; max-width: none; }
.ocean figcaption { font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.starfish { background: var(--cream); text-align: center; }
.starfish .wrap { display: grid; justify-items: center; gap: 14px; }
.starfish .star { width: 56px; height: 56px; }
.starfish .eyebrow { margin: 0; }
.starfish .star-story { margin: 0 auto; width: 100%; max-width: 760px; font-family: var(--serif); font-style: italic; font-size: clamp(20px, 2.4vw, 25px); line-height: 1.5; color: var(--ink); }
.starfish .moral { margin: 6px auto 0; width: 100%; max-width: 640px; font-size: 19px; font-weight: 700; color: var(--teal); }
.starfish .credit { margin: 0; font-size: 13px; color: var(--muted); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.founder { background: var(--cream); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px; }
.founder h3 { margin-bottom: 4px; }
.founder .role { font-size: 14px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); margin: 0 0 12px; }
.founder p { margin: 0; font-size: 17px; color: var(--muted); }
.values { margin-top: 20px; display: grid; gap: 12px; }
.values div { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; font-size: 17px; }
.values svg { width: 22px; height: 22px; margin-top: 3px; }
.values b { color: var(--teal); }
@media (max-width: 820px) { .story { grid-template-columns: 1fr; } }

/* Contact */
.contact { display: grid; grid-template-columns: 1fr 1.15fr; gap: 44px; margin-top: 30px; align-items: start; }
.contact > * { min-width: 0; }
@media (max-width: 820px) { .contact { grid-template-columns: 1fr; } }
.reach { display: grid; gap: 14px; }
.reach div { background: var(--white); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; }
.reach span { display: block; font-size: 13px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold); }
.reach b { font-size: 20px; user-select: all; word-break: break-word; }
form.msg { display: grid; gap: 14px; background: var(--white); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px; }
.field { display: grid; gap: 6px; }
.field label { font-size: 14px; font-weight: 700; }
.field input, .field select, .field textarea { font: 16px var(--sans); color: var(--ink); background: var(--cream); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; width: 100%; }
.field textarea { min-height: 110px; resize: vertical; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 520px) { .two { grid-template-columns: 1fr; } }
.err { color: #A2400F; font-size: 15px; margin: 0; }
.summary { background: var(--gold-soft); border-radius: 12px; padding: 16px; }
.summary pre { white-space: pre-wrap; word-break: break-word; font: 15px/1.5 var(--sans); margin: 0 0 12px; }
.note { font-size: 14px; color: var(--muted); }
.formcard { background: var(--cream); border: 1px solid var(--line); border-radius: var(--radius); padding: 28px; display: grid; gap: 12px; align-content: start; justify-items: start; }
.formcard .star { width: 40px; height: 40px; }
.formcard h3 { font-size: 26px; }
.formcard p { margin: 0; color: var(--muted); }
.formcard ul { margin: 4px 0 8px; padding-left: 20px; display: grid; gap: 6px; color: var(--ink); }
.formcard .btn { font-size: 17px; padding: 14px 26px; }

footer { background: var(--teal-deep); color: #DCEDEA; padding-block: 44px; font-size: 15px; }
footer .wrap { display: grid; grid-template-columns: auto 1fr; gap: 28px; align-items: center; }
footer img { width: 92px; height: auto; }
footer b { color: #FFFFFF; font-family: var(--serif); font-size: 19px; font-weight: 600; }
footer p { margin: 4px 0; max-width: none; }
footer a { color: #F2C66B; }
@media (max-width: 600px) { footer .wrap { grid-template-columns: 1fr; } }
</style>

const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
let lang = store.get("bali.lang") || ((navigator.language || "en").toLowerCase().startsWith("es") ? "es" : "en");
const $ = (s) => document.querySelector(s);
const t = (k) => T[lang][k] ?? T.en[k] ?? k;

function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-ph]").forEach((el) => { el.placeholder = t(el.dataset.i18nPh); });
  document.querySelectorAll("[data-i18n-html]").forEach((el) => { el.innerHTML = t(el.dataset.i18nHtml); });
  document.querySelectorAll(".lang button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
}

document.querySelectorAll(".lang button").forEach((b) => b.addEventListener("click", () => { lang = b.dataset.lang; store.set("bali.lang", lang); applyLang(); }));

applyLang();
</script>
